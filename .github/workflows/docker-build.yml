name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
      image-name:
        description: Name of the container image
        required: true
        type: string

      dockerfile:
        description: Path to the Dockerfile
        required: false
        type: string
        default: "Dockerfile"

      build-context:
        description: Docker build context directory
        required: false
        type: string
        default: "."

      image-tag:
        description: Container image tag
        required: false
        type: string
        default: "latest"

    outputs:
      image:
        description: Published container image tag reference
        value: ${{ jobs.build-and-push.outputs.image }}

      image-digest:
        description: Immutable container image reference using SHA-256 digest
        value: ${{ jobs.build-and-push.outputs.image-digest }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Container Image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image-reference.outputs.image }}
      image-digest: ${{ steps.image-digest.outputs.image-digest }}

    steps:
      - name: Checkout application source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image reference
        id: image-reference
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          IMAGE_OWNER=$(echo "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')

          if [[ ! "$IMAGE_NAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "Invalid image name: $IMAGE_NAME"
            exit 1
          fi

          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag: $IMAGE_TAG"
            exit 1
          fi

          IMAGE="ghcr.io/${IMAGE_OWNER}/${IMAGE_NAME}:${IMAGE_TAG}"
          IMAGE_REPOSITORY="ghcr.io/${IMAGE_OWNER}/${IMAGE_NAME}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.image-reference.outputs.image }}

      - name: Generate immutable image reference
        id: image-digest
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ steps.image-reference.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid image digest returned by Docker Buildx."
            exit 1
          fi

          echo "image-digest=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"