name: Reusable Container Image Signing

on:
  workflow_call:
    inputs:
      image-ref:
        description: Immutable GHCR image reference using a SHA-256 digest
        required: true
        type: string

permissions:
  id-token: write
  packages: write

jobs:
  sign-image:
    name: Sign Container Image
    runs-on: ubuntu-latest

    steps:
      - name: Validate image reference
        shell: bash
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          if [[ ! "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$ ]]; then
            echo "Image reference must be a GHCR image pinned to a SHA-256 digest."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Sign container image
        shell: bash
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: cosign sign --yes "$IMAGE_REF"