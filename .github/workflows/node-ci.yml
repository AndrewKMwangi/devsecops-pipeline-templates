
name: Reusable Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used to build the application
        required: false
        type: string
        default: "22"

      working-directory:
        description: Directory containing the Node.js application
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  node-build:
    name: Build Node.js Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout application source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
