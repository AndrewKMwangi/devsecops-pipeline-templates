
name: Reusable Kubernetes Validation

on:
  workflow_call:
    inputs:
      gitops-owner:
        description: GitHub account or organization owning the GitOps repository
        required: true
        type: string

      gitops-repository:
        description: GitOps repository name
        required: true
        type: string

      target-branch:
        description: GitOps branch containing the Helm chart
        required: false
        type: string
        default: main

      chart-directory:
        description: Chart directory relative to the GitOps repository root
        required: true
        type: string

      values-file:
        description: Values file path relative to the GitOps repository root
        required: true
        type: string

      release-name:
        description: Helm release name used during rendering
        required: false
        type: string
        default: validation-release

      kubernetes-version:
        description: Kubernetes version used for schema validation
        required: false
        type: string
        default: "1.32.0"

    secrets:
      gitops-app-client-id:
        required: true
      gitops-app-private-key:
        required: true

permissions:
  contents: read

jobs:
  helm-validation:
    name: Validate GitOps Helm Chart
    runs-on: ubuntu-latest

    steps:
      - name: Diagnose GitHub App private-key format
        shell: bash
        env:
          APP_PRIVATE_KEY: ${{ secrets.gitops-app-private-key }}
        run: |
          set -euo pipefail

          if [[ -z "$APP_PRIVATE_KEY" ]]; then
            echo "Diagnostic: GitHub App private-key secret is empty or unavailable."
            exit 1
          fi

          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          chmod 600 "$key_file"
          printf '%s' "$APP_PRIVATE_KEY" > "$key_file"

          key_bytes="$(wc -c < "$key_file" | tr -d ' ')"
          first_line="$(head -n 1 "$key_file")"
          last_line="$(tail -n 1 "$key_file")"

          echo "Diagnostic: private-key secret is present."
          echo "Diagnostic: private-key size is ${key_bytes} bytes."

          if [[ "$first_line" != "-----BEGIN "* "-----" ]]; then
            echo "Diagnostic: PEM BEGIN marker is missing or malformed."
            exit 1
          fi

          if [[ "$last_line" != "-----END "* "-----" ]]; then
            echo "Diagnostic: PEM END marker is missing or malformed."
            exit 1
          fi

          if openssl pkey -in "$key_file" -noout >/dev/null 2>&1; then
            echo "Diagnostic: OpenSSL successfully parsed the private key."
          else
            echo "Diagnostic: OpenSSL could not parse the private key."
            exit 1
          fi

      - name: Generate read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.gitops-app-client-id }}
          private-key: ${{ secrets.gitops-app-private-key }}
          owner: ${{ inputs.gitops-owner }}
          repositories: ${{ inputs.gitops-repository }}
          permission-contents: read

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops-owner }}/${{ inputs.gitops-repository }}
          ref: ${{ inputs.target-branch }}
          token: ${{ steps.app-token.outputs.token }}
          path: gitops

      - name: Validate chart paths
        shell: bash
        working-directory: gitops
        env:
          CHART_DIRECTORY: ${{ inputs.chart-directory }}
          VALUES_FILE: ${{ inputs.values-file }}
        run: |
          if [[ "$CHART_DIRECTORY" == /* || "$CHART_DIRECTORY" == *".."* ]]; then
            echo "Invalid chart directory."
            exit 1
          fi

          if [[ "$VALUES_FILE" == /* || "$VALUES_FILE" == *".."* ]]; then
            echo "Invalid values file path."
            exit 1
          fi

          if [[ ! -f "$CHART_DIRECTORY/Chart.yaml" ]]; then
            echo "Chart.yaml not found."
            exit 1
          fi

          if [[ ! -f "$VALUES_FILE" ]]; then
            echo "Helm values file not found."
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint Helm chart
        working-directory: gitops
        env:
          CHART_DIRECTORY: ${{ inputs.chart-directory }}
          VALUES_FILE: ${{ inputs.values-file }}
        run: |
          helm lint "$CHART_DIRECTORY" \
            --values "$VALUES_FILE"

      - name: Render Kubernetes manifests
        working-directory: gitops
        env:
          CHART_DIRECTORY: ${{ inputs.chart-directory }}
          VALUES_FILE: ${{ inputs.values-file }}
          RELEASE_NAME: ${{ inputs.release-name }}
        run: |
          helm template "$RELEASE_NAME" "$CHART_DIRECTORY" \
            --values "$VALUES_FILE" \
            --output-dir "$RUNNER_TEMP/rendered-manifests"

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-kubernetes-manifests
          path: ${{ runner.temp }}/rendered-manifests/
          if-no-files-found: error
          retention-days: 7

  manifest-validation:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: helm-validation

    steps:
      - name: Download rendered manifests
        uses: actions/download-artifact@v4
        with:
          name: rendered-kubernetes-manifests
          path: rendered-manifests

      - name: Validate Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          args: >-
            -strict
            -summary
            -kubernetes-version ${{ inputs.kubernetes-version }}
            -schema-location default
            -schema-location https://raw.githubusercontent.com/CustomResourceDefinition/catalog/main/schema/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            rendered-manifests/
